services:
  - type: static
    name: Izabela-frontend
    buildCommand: npm install && npm run build
    publishPath: ./dist/frontend/browser

    # CRÍTICO: Regras de roteamento para SPA Angular
    # Redireciona todas as requisições para index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Force HTTPS for 1 year
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

      # Prevent clickjacking
      - path: /*
        name: X-Frame-Options
        value: DENY

      # Prevent MIME type sniffing
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # Referrer policy
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # Permissions policy — disable unused browser features
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()

      # Cache static assets aggressively (hashed filenames by Angular CLI)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      - path: /*.js
        name: Cache-Control
        value: public, max-age=31536000, immutable

      - path: /*.css
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Never cache index.html (always fetch latest shell)
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
