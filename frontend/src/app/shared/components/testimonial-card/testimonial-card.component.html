<article class="testimonial-card">
  <span class="quote-icon" aria-hidden="true">
    <i class="pi pi-quote-left"></i>
  </span>

  <p class="testimonial-content">“{{ testimonial.content }}”</p>

  @if (testimonial.rating) {
    <div class="rating" [attr.aria-label]="testimonial.rating + ' de 5 estrelas'">
      @for (star of stars; track $index) {
        <i class="pi pi-star-fill"></i>
      }
    </div>
  }

  <footer class="testimonial-author">
    @if (testimonial.clientAvatarUrl) {
      <img
        [src]="testimonial.clientAvatarUrl"
        [alt]="testimonial.clientName" />
    } @else {
      <span class="avatar-placeholder">{{ initials }}</span>
    }

    <div>
      <strong>{{ testimonial.clientName }}</strong>
      <small>Cliente</small>
    </div>
  </footer>
</article>
