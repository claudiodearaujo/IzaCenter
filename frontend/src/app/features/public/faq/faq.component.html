<section class="public-page">
  <div class="public-container">
    <header class="page-hero">
      <span class="page-icon"><i class="pi pi-question-circle"></i></span>
      <div>
        <span class="eyebrow">Ajuda</span>
        <h1>Perguntas Frequentes</h1>
        <p>Tire dúvidas sobre serviços, contratação, agendamentos e entregas.</p>
      </div>
    </header>

    <div class="faq-shell">
      <p-accordion [multiple]="true">
        @for (faq of faqs(); track faq.question) {
          <p-accordion-panel>
            <p-accordion-header>{{ faq.question }}</p-accordion-header>
            <p-accordion-content>
              <p>{{ faq.answer }}</p>
            </p-accordion-content>
          </p-accordion-panel>
        }
      </p-accordion>
    </div>
  </div>
</section>
