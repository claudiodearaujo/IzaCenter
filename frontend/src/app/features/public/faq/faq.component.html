<div class="py-16">
  <div class="container mx-auto px-4 max-w-3xl">
    <div class="text-center mb-16">
      <div class="w-16 h-16 rounded-2xl bg-primary-100 flex items-center justify-center mx-auto mb-4"><i class="pi pi-question-circle text-2xl text-primary-700"></i></div>
      <h1 class="text-4xl md:text-5xl font-serif font-bold text-neutral-900 mb-4">Perguntas Frequentes</h1>
      <p class="text-xl text-neutral-600">Tire dúvidas sobre serviços, contratação, agendamentos e entregas.</p>
    </div>
    <p-accordion [multiple]="true">
      @for (faq of faqs(); track faq.question) {
        <p-accordion-panel>
          <p-accordion-header>{{ faq.question }}</p-accordion-header>
          <p-accordion-content><p class="text-neutral-600 leading-relaxed">{{ faq.answer }}</p></p-accordion-content>
        </p-accordion-panel>
      }
    </p-accordion>
  </div>
</div>
