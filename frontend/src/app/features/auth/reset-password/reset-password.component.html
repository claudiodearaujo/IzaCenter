<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 via-white to-secondary-50 py-12 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2">
        <img src="assets/images/logo.jpeg" alt="Izabela Tarot" class="h-10 w-10 rounded-full object-cover">
        <span class="text-2xl font-serif font-semibold text-primary-800">Izabela Tarot</span>
      </a>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8">
      @if (success()) {
      <div class="text-center">
        <span class="text-5xl block mb-4">✅</span>
        <h1 class="text-2xl font-serif font-bold text-neutral-900 mb-4">{{ 'auth.resetPassword.title' | translate }}
        </h1>
        <p class="text-neutral-600 mb-6">{{ 'auth.resetPassword.subtitle' | translate }}</p>
        <a routerLink="/auth/login">
          <p-button [label]="'auth.login.loginButton' | translate" styleClass="w-full" />
        </a>
      </div>
      } @else {
      <h1 class="text-2xl font-serif font-bold text-neutral-900 text-center mb-2">{{ 'auth.resetPassword.title' |
        translate }}</h1>
      <p class="text-neutral-600 text-center mb-8">{{ 'auth.resetPassword.subtitle' | translate }}</p>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="password" class="block text-sm font-medium text-neutral-700 mb-2">{{ 'auth.resetPassword.password'
            | translate }}</label>
          <p-password id="password" [(ngModel)]="form.password" name="password" [toggleMask]="true" styleClass="w-full"
            inputStyleClass="w-full" [placeholder]="'auth.resetPassword.password' | translate" required />
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-neutral-700 mb-2">{{
            'auth.resetPassword.confirmPassword' | translate }}</label>
          <p-password id="confirmPassword" [(ngModel)]="form.confirmPassword" name="confirmPassword" [toggleMask]="true"
            [feedback]="false" styleClass="w-full" inputStyleClass="w-full"
            [placeholder]="'auth.resetPassword.confirmPassword' | translate" required />
        </div>
        <p-button type="submit" [label]="'auth.resetPassword.resetButton' | translate" [loading]="isLoading()"
          styleClass="w-full" size="large" />
      </form>
      }
    </div>
  </div>
</div>
