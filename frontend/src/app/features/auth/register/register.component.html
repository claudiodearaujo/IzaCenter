<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 via-white to-secondary-50 py-12 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2">
        <img src="assets/images/logo.jpeg" alt="Izabela Tarot" class="h-10 w-10 rounded-full object-cover">
        <span class="text-2xl font-serif font-semibold text-primary-800">Izabela Tarot</span>
      </a>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8">
      <h1 class="text-2xl font-serif font-bold text-neutral-900 text-center mb-2">{{ 'auth.register.title' | translate
        }}</h1>
      <p class="text-neutral-600 text-center mb-8">{{ 'auth.register.subtitle' | translate }}</p>

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="fullName" class="block text-sm font-medium text-neutral-700 mb-2">{{ 'auth.register.name' |
            translate }}</label>
          <input pInputText id="fullName" [(ngModel)]="form.fullName" name="fullName" class="w-full"
            [placeholder]="'auth.register.name' | translate" required />
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-neutral-700 mb-2">{{ 'auth.register.email' |
            translate }}</label>
          <input pInputText id="email" [(ngModel)]="form.email" name="email" type="email" class="w-full"
            placeholder="seu@email.com" required />
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-neutral-700 mb-2">{{ 'auth.register.phone' |
            translate }}</label>
          <p-inputMask id="phone" [(ngModel)]="form.phone" name="phone" mask="(99) 99999-9999"
            placeholder="(31) 99999-9999" styleClass="w-full" />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-neutral-700 mb-2">{{ 'auth.register.password' |
            translate }}</label>
          <p-password id="password" [(ngModel)]="form.password" name="password" [toggleMask]="true" styleClass="w-full"
            inputStyleClass="w-full" [placeholder]="'auth.register.password' | translate" required />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-neutral-700 mb-2">{{
            'auth.register.confirmPassword' | translate }}</label>
          <p-password id="confirmPassword" [(ngModel)]="form.confirmPassword" name="confirmPassword" [toggleMask]="true"
            [feedback]="false" styleClass="w-full" inputStyleClass="w-full"
            [placeholder]="'auth.register.confirmPassword' | translate" required />
        </div>

        <p-button type="submit" [label]="'auth.register.registerButton' | translate" [loading]="isLoading()"
          styleClass="w-full" size="large" />
      </form>

      <div class="mt-8 pt-6 border-t border-neutral-100 text-center">
        <p class="text-neutral-600">{{ 'auth.register.hasAccount' | translate }} <a routerLink="/auth/login"
            class="text-primary-600 hover:text-primary-700 font-medium">{{ 'auth.register.loginLink' | translate }}</a>
        </p>
      </div>
    </div>

    <div class="text-center mt-6">
      <a routerLink="/" class="text-neutral-500 hover:text-neutral-700 text-sm inline-flex items-center gap-1">
        <i class="pi pi-arrow-left text-xs"></i> {{ 'common.back' | translate }}
      </a>
    </div>
  </div>
</div>
