<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 via-white to-secondary-50 py-12 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2">
        <span class="text-3xl">✨</span>
        <span class="text-2xl font-serif font-semibold text-primary-800">Izabela Tarot</span>
      </a>
    </div>

    <div class="bg-white rounded-3xl shadow-xl p-8">
      @if (emailSent()) {
        <div class="text-center">
          <span class="text-5xl block mb-4">📧</span>
          <h1 class="text-2xl font-serif font-bold text-neutral-900 mb-4">{{ 'auth.forgotPassword.title' | translate }}</h1>
          <p class="text-neutral-600 mb-6">{{ 'auth.forgotPassword.subtitle' | translate }}</p>
          <a routerLink="/auth/login">
            <p-button [label]="'auth.forgotPassword.backToLogin' | translate" styleClass="w-full" />
          </a>
        </div>
      } @else {
        <h1 class="text-2xl font-serif font-bold text-neutral-900 text-center mb-2">{{ 'auth.forgotPassword.title' | translate }}</h1>
        <p class="text-neutral-600 text-center mb-8">{{ 'auth.forgotPassword.subtitle' | translate }}</p>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-neutral-700 mb-2">{{ 'auth.forgotPassword.email' | translate }}</label>
            <input pInputText id="email" [(ngModel)]="email" name="email" type="email" class="w-full" placeholder="seu@email.com" required />
          </div>
          <p-button type="submit" [label]="'auth.forgotPassword.sendButton' | translate" [loading]="isLoading()" styleClass="w-full" size="large" />
        </form>
      }

      <div class="mt-8 pt-6 border-t border-neutral-100 text-center">
        <a routerLink="/auth/login" class="text-primary-600 hover:text-primary-700 font-medium">{{ 'auth.forgotPassword.backToLogin' | translate }}</a>
      </div>
    </div>
  </div>
</div>
