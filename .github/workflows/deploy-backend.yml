name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}")
          echo "Render deploy hook responded with HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Deploy hook failed with status $STATUS"
            exit 1
          fi

      - name: Wait for deployment
        run: sleep 60

      - name: Health check
        run: |
          MAX_ATTEMPTS=10
          ATTEMPT=0
          URL="${{ secrets.BACKEND_URL }}/health"
          until [ $ATTEMPT -ge $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Backend is healthy (HTTP $STATUS)"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "❌ Backend health check failed after $MAX_ATTEMPTS attempts"
          exit 1
